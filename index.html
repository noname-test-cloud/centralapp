<html>
<head>

    #connection {
        background: none;

    #creeruncompte {
        background: none;

</head>
<body>

<h1 id="seconnectertext">Se connecter</h1>
<h1 id="creeruncomptetext" >Créer un compte</h1>
<input id="entreeidentifiant" type="text">
<input id="entreemotdepasse" type="password">
<button id="connection" onclick="connection()">Se connecter</button>
<button id="creeruncompte" onclick="creeruncompte()">Créer mon compte</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const db = window.supabase.createClient(
    "https://oezjikkxizuftvlepuyw.supabase.co",
    "sb_publishable_RhLg04cScEIdIlD46kTi0Q_Cpir8sd5"
);

document.getElementById("creeruncomptetext").style.display = "none";
document.getElementById("connection").style.display = "none";

let centraldonnee = "none";
let identifiantentree = "none";
let motdepasseentree = "none";

function connection() {
    console.log("Error");
}

async function creeruncompte() {
 
    identifiantentree = document.getElementById("entreeidentifiant").value;
    motdepasseentree = document.getElementById("entreemotdepasse").value;

    const { data, error } = await db
        .from("serveur")
        .select("etatcompte1")
        .eq("id", 1);

    if (error) {
        console.log("Erreur :", error);
        return;
    }

    if (data.length === 0) {
        return;
    }

    centraldonnee = data[0].etatcompte1;

    if (centraldonnee == "libre") {
        const { data, error } = await db
        .from("serveur")
        .update({
            etatcompte1: "nolibre",
            identifiantcompte1: identifiantentree,
            motdepassecompte1: motdepasseentree
            console.log("operation terminee");
        })
        .eq("id", 1)
        .select();

        if (error) {
            console.log("Erreur :", error);
        }
    }
}    
</script>

</body>
